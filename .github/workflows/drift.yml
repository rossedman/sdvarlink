name: IDL drift

# Weekly: if systemd tagged a release we have no snapshot for, extract its
# IDL, regenerate bindings and docs, and open a pull request with the API
# change report.

on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Find the newest systemd release
        id: latest
        run: |
          v=$(git ls-remote --tags https://github.com/systemd/systemd 'refs/tags/v*' \
                | sed -nE 's#.*refs/tags/v([0-9]+)$#\1#p' | sort -n | tail -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -d "idl/v$v" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Extract IDL and regenerate
        if: steps.latest.outputs.new == 'true'
        run: |
          make idl SYSTEMD_VERSION=${{ steps.latest.outputs.version }}
          make generate docs-reference
          go build ./... && go test ./...
          prev=$(ls -d idl/v* | sed 's#idl/v##' | sort -n | tail -2 | head -1)
          go run ./cmd/sdvarlink-gen diff "$prev" ${{ steps.latest.outputs.version }} > /tmp/api-diff.md
      - uses: peter-evans/create-pull-request@v7
        if: steps.latest.outputs.new == 'true'
        with:
          branch: idl/systemd-v${{ steps.latest.outputs.version }}
          title: "Add bindings for systemd v${{ steps.latest.outputs.version }}"
          commit-message: "idl: add systemd v${{ steps.latest.outputs.version }} snapshot and bindings"
          body-path: /tmp/api-diff.md
          labels: systemd-release
