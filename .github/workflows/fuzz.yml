name: Fuzz

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target
        default: 10m

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: FuzzReadMessage, pkg: ./internal/wire/ }
          - { name: FuzzUnmarshal, pkg: ./varlink/ }
          - { name: FuzzParse, pkg: ./idl/ }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime ${{ inputs.fuzztime || '10m' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crashers-${{ matrix.target.name }}
          path: "**/testdata/fuzz/"
